schema_version: "1.0"
environment: demo

# Conservative Demo validation limits. They are not real-money recommendations.
max_order_equity_fraction: 0.01
max_issuer_fraction: 0.05
max_sector_fraction: 0.20
max_gross_fraction: 0.50
max_net_fraction: 0.50
min_cash_buffer_fraction: 0.20
required_leverage: 1
daily_loss_stop_fraction: 0.01
drawdown_stop_fraction: 0.05

quote_max_age_seconds: 30
account_max_age_seconds: 15
approval_max_age_seconds: 300
regular_hours_only: true
allowed_asset_types:
  - equity
  - etf
