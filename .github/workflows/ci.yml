name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  lock-integrity:
    name: Lock and compatibility export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          python-version: "3.12"
          enable-cache: true

      - name: Reject lock or requirements drift
        shell: bash
        run: |
          uv lock --check
          exported_requirements="${RUNNER_TEMP}/requirements.txt"
          uv export --quiet --frozen --no-dev --format requirements.txt --no-annotate --no-header --output-file "${exported_requirements}"
          diff -u requirements.txt "${exported_requirements}"

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Synchronize frozen environment
        run: uv sync --frozen --all-groups

      - name: Check dependency declarations
        run: uv run --frozen deptry .

      - name: Run unit tests
        run: uv run --frozen python -m pytest -q

      - name: Compile Python sources
        run: >-
          uv run --frozen python -m compileall -q
          agents brokers execution risk scheduler shared strategy tools scripts
          run_pipeline.py

      - name: Check installed dependency consistency
        run: uv run --frozen python -m pip check
