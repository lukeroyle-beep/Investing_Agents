[project]
name = "investing-agents"
version = "0.1.0"
description = "A deterministic, advisory-only portfolio engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=3.0.1,<4",
    "pyyaml>=6.0.3,<7",
    "yfinance>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1,<1",
    "pip>=26.2.1,<27",
    "pip-audit>=2.9.0,<3",
    "pytest>=9.0.3,<10",
]

[tool.uv]
package = false
required-version = "==0.11.6"

[tool.deptry]
known_first_party = ["agents", "brokers", "execution", "risk", "scheduler", "shared", "strategy"]
